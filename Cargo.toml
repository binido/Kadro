[package]
name = "kadro"
version = "0.9.0"
edition = "2024"

[dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-image = "0.3"
objc2-core-text = "0.3"
objc2-foundation = "0.3"
objc2-image-io = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-service-management = "0.3"
objc2-uniform-type-identifiers = "0.3"
objc2-user-notifications = "0.3"
objc2-vision = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Набор линтов из https://github.com/apollographql/rust-best-practices:
# явные приведения указателей, заимствование вместо лишних владений и единый стиль.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
borrow_as_ptr = "warn"
cast_lossless = "warn"
explicit_iter_loop = "warn"
format_push_string = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
redundant_closure_for_method_calls = "warn"
ref_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
