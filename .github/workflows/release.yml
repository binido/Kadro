name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macos-26 runs on Apple Silicon, so the build is arm64 only.
    # The image SDK decides the look. With an older SDK macOS 26+ draws windows in the old style.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version from Cargo.toml goes into Info.plist, the tag must match it.
      - name: Check tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo fmt --check

      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo test --locked

      - run: ./scripts/bundle.sh

      - name: Check architecture
        run: test "$(lipo -archs build/Kadro.app/Contents/MacOS/Kadro)" = arm64

      # The installer is a disk image where Kadro.app is dragged onto the Applications shortcut.
      - name: Build installer
        run: |
          mkdir -p build/dmg
          cp -R build/Kadro.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Kadro -srcfolder build/dmg -ov -format UDZO "Kadro-${GITHUB_REF_NAME#v}-arm64.dmg"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Kadro-${GITHUB_REF_NAME#v}-arm64.dmg" --draft --generate-notes --title "Kadro $GITHUB_REF_NAME"
