name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macos-15 работает на Apple Silicon, поэтому сборка получается только под arm64.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

      - run: ./scripts/bundle.sh

      - name: Check architecture
        run: test "$(lipo -archs build/Kadro.app/Contents/MacOS/Kadro)" = arm64

      # ditto сохраняет подпись и права файлов внутри .app, обычный zip их теряет.
      - name: Zip app
        run: ditto -c -k --keepParent build/Kadro.app Kadro-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Kadro-arm64
          path: Kadro-arm64.zip
